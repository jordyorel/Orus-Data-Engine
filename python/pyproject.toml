[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "orus-ontology"
version = "0.1.0"
description = "Versioned semantic layer for the Orus data platform"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11,<3",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.2,<4",
]
dev = [
    "pytest>=8.3,<9",
    "pyright>=1.1.400,<2",
    "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
orus_ontology = ["storage/migrations/*.sql"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = "error"
venv = ".venv"
venvPath = "."

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "N",
    "RUF",
    "UP",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.format]
indent-style = "space"
line-ending = "lf"
quote-style = "double"

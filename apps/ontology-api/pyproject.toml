[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "orus-ontology-api"
version = "0.1.0"
description = "Bounded HTTP query API for Orus Ontology"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<0.117",
    "orus-ontology[postgres]>=0.1.0,<0.2",
    "starlette>=0.46,<0.49",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
    "pyright>=1.1.400,<2",
    "ruff>=0.11,<1",
]

[project.scripts]
orus-ontology-api = "orus_ontology_api.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
filterwarnings = [
    "ignore:'asyncio.iscoroutinefunction' is deprecated.*:DeprecationWarning:fastapi.routing",
]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src", "../../python/src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = "error"
venv = ".venv"
venvPath = "."

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "RUF", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.format]
indent-style = "space"
line-ending = "lf"
quote-style = "double"

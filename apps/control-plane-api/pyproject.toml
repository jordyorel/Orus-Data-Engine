[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "orus-control-plane-api"
version = "0.1.0"
description = "Project, source and execution control plane for Orus"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<0.117",
    "pydantic>=2.11,<3",
    "python-multipart>=0.0.20,<1",
    "starlette>=0.46,<0.49",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
    "pyright>=1.1.400,<2",
    "ruff>=0.11,<1",
]

[project.scripts]
orus-control-plane-api = "orus_control_plane_api.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
filterwarnings = [
    "ignore:'asyncio.iscoroutinefunction' is deprecated.*:DeprecationWarning:fastapi.routing",
]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = "error"
venv = ".venv"
venvPath = "."

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "RUF", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
